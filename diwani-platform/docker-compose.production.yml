# ===================================
# منصة ديواني - Docker Compose Production
# Diwani Platform - Production Environment
# Saudi NCA/PDPL Compliance Ready
# ===================================

version: '3.9'

# Security defaults for all services
x-security-opts: &security-opts
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # =============================
  # PostgreSQL Database + PostGIS
  # =============================
  db:
    image: postgis/postgis:16-3.4
    container_name: diwani_db_prod
    restart: always
    <<: [*security-opts, *default-logging]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./backups/postgres:/backups
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diwani_db}
      POSTGRES_USER: ${POSTGRES_USER:-diwani_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=ar_SA.UTF-8"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diwani_user} -d ${POSTGRES_DB:-diwani_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - diwani_internal
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # =============================
  # Redis (Cache & Celery Broker)
  # =============================
  redis:
    image: redis:7.4-alpine
    container_name: diwani_redis_prod
    restart: always
    <<: [*security-opts, *default-logging]
    read_only: true
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --tcp-keepalive 300
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - diwani_internal
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M

  # =============================
  # Django Backend Application
  # =============================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
      args:
        - BUILD_DATE=${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        - VERSION=${VERSION:-1.0.0}
    container_name: diwani_backend_prod
    restart: always
    <<: [*security-opts, *default-logging]
    user: "1000:1000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application
             --bind 0.0.0.0:8000
             --workers ${GUNICORN_WORKERS:-4}
             --threads ${GUNICORN_THREADS:-2}
             --worker-class gthread
             --worker-tmp-dir /dev/shm
             --timeout 120
             --keep-alive 5
             --max-requests 1000
             --max-requests-jitter 50
             --access-logfile -
             --error-logfile -
             --capture-output
             --enable-stdio-inheritance"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - logs_volume:/app/logs
    expose:
      - "8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DATABASE_URL=postgis://${POSTGRES_USER:-diwani_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-diwani_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://localhost}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://localhost}
      # External Services
      - UNIFONIC_APP_ID=${UNIFONIC_APP_ID:-}
      - UNIFONIC_SENDER_ID=${UNIFONIC_SENDER_ID:-}
      - MOYASAR_API_KEY=${MOYASAR_API_KEY:-}
      - MOYASAR_PUBLISHABLE_KEY=${MOYASAR_PUBLISHABLE_KEY:-}
      # AWS S3 (Optional)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-}
      # Sentry (Error Tracking)
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - diwani_internal
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =============================
  # Celery Worker (Background Tasks)
  # =============================
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    container_name: diwani_celery_worker_prod
    restart: always
    <<: [*security-opts, *default-logging]
    user: "1000:1000"
    command: >
      celery -A config worker
      -l INFO
      --concurrency=${CELERY_CONCURRENCY:-4}
      --max-tasks-per-child=100
      -Q default,notifications,orders,payments
    volumes:
      - media_volume:/app/media
      - logs_volume:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgis://${POSTGRES_USER:-diwani_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-diwani_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - UNIFONIC_APP_ID=${UNIFONIC_APP_ID:-}
      - UNIFONIC_SENDER_ID=${UNIFONIC_SENDER_ID:-}
    depends_on:
      - backend
      - redis
    networks:
      - diwani_internal
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # =============================
  # Celery Beat (Scheduled Tasks)
  # =============================
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    container_name: diwani_celery_beat_prod
    restart: always
    <<: [*security-opts, *default-logging]
    user: "1000:1000"
    command: >
      celery -A config beat
      -l INFO
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - logs_volume:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgis://${POSTGRES_USER:-diwani_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-diwani_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      - backend
      - redis
    networks:
      - diwani_internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # =============================
  # Nginx (Reverse Proxy + WAF)
  # =============================
  nginx:
    image: nginx:1.27-alpine
    container_name: diwani_nginx_prod
    restart: always
    <<: [*security-opts, *default-logging]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=128M
      - /var/run:size=16M
      - /tmp:size=64M
    volumes:
      - ./docker/nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
      - logs_volume:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - diwani_internal
      - diwani_external
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # =============================
  # Prometheus (Metrics)
  # =============================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: diwani_prometheus
    restart: always
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    expose:
      - "9090"
    networks:
      - diwani_internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # =============================
  # Grafana (Dashboards)
  # =============================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: diwani_grafana
    restart: always
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    expose:
      - "3000"
    depends_on:
      - prometheus
    networks:
      - diwani_internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # =============================
  # Backup Service
  # =============================
  backup:
    image: prodrigestivill/postgres-backup-local
    container_name: diwani_backup
    restart: always
    volumes:
      - ./backups/postgres:/backups
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-diwani_db}
      - POSTGRES_USER=${POSTGRES_USER:-diwani_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    depends_on:
      db:
        condition: service_healthy
    networks:
      - diwani_internal

# =============================
# Volumes
# =============================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  logs_volume:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# =============================
# Networks
# =============================
networks:
  diwani_internal:
    driver: bridge
    internal: true
  diwani_external:
    driver: bridge
