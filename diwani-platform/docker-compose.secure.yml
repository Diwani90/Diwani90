# ===================================
# منصة ديواني - Docker Compose (Secure Production)
# Diwani Platform - Security Hardened
# Saudi NCA Compliance Ready
# ===================================

version: '3.9'

x-security-opts: &security-opts
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-resource-limits: &resource-limits
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 1G
      reservations:
        cpus: '0.25'
        memory: 256M

services:
  # =============================
  # PostgreSQL Database + PostGIS
  # =============================
  db:
    image: postgis/postgis:16-3.4
    container_name: diwani_db
    restart: unless-stopped
    <<: *security-opts
    <<: *resource-limits
    user: "999:999"  # postgres user
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: ${DB_NAME:-diwani_db}
      POSTGRES_USER: ${DB_USER:-diwani_user}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # Security settings
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    secrets:
      - db_password
    ports:
      - "127.0.0.1:5432:5432"  # Only localhost access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - diwani_internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================
  # Redis (Cache & Celery Broker)
  # =============================
  redis:
    image: redis:7.4-alpine
    container_name: diwani_redis
    restart: unless-stopped
    <<: *security-opts
    user: "999:999"  # redis user
    read_only: true
    tmpfs:
      - /tmp:size=64M
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-changeme}
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command DEBUG ""
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - diwani_internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # =============================
  # Django Backend Application
  # =============================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.secure
    container_name: diwani_backend
    restart: unless-stopped
    <<: *security-opts
    <<: *resource-limits
    user: "1000:1000"  # Non-root user
    read_only: true
    tmpfs:
      - /tmp:size=128M
      - /app/.cache:size=64M
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application
             --bind 0.0.0.0:8000
             --workers 4
             --threads 2
             --worker-class gthread
             --worker-tmp-dir /tmp
             --timeout 60
             --graceful-timeout 30
             --keep-alive 5
             --max-requests 1000
             --max-requests-jitter 50
             --access-logfile -
             --error-logfile -
             --capture-output"
    volumes:
      - static_volume:/app/static:rw
      - media_volume:/app/media:rw
    environment:
      - DEBUG=False
      - DJANGO_ENV=production
      - SECRET_KEY_FILE=/run/secrets/django_secret
      - DATABASE_URL=postgis://${DB_USER:-diwani_user}:${DB_PASSWORD}@db:5432/${DB_NAME:-diwani_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,api.diwani.sa}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://diwani.sa,https://api.diwani.sa}
    secrets:
      - django_secret
      - db_password
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - diwani_internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # =============================
  # Celery Worker (Background Tasks)
  # =============================
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.secure
    container_name: diwani_celery_worker
    restart: unless-stopped
    <<: *security-opts
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=128M
    command: >
      celery -A config worker
      -l INFO
      --concurrency=4
      --max-tasks-per-child=100
      --without-heartbeat
      --without-gossip
      --without-mingle
    volumes:
      - media_volume:/app/media:rw
    environment:
      - DEBUG=False
      - SECRET_KEY_FILE=/run/secrets/django_secret
      - DATABASE_URL=postgis://${DB_USER:-diwani_user}:${DB_PASSWORD}@db:5432/${DB_NAME:-diwani_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
    secrets:
      - django_secret
      - db_password
    depends_on:
      - backend
      - redis
    networks:
      - diwani_internal
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # =============================
  # Celery Beat (Scheduled Tasks)
  # =============================
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.secure
    container_name: diwani_celery_beat
    restart: unless-stopped
    <<: *security-opts
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=64M
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DEBUG=False
      - SECRET_KEY_FILE=/run/secrets/django_secret
      - DATABASE_URL=postgis://${DB_USER:-diwani_user}:${DB_PASSWORD}@db:5432/${DB_NAME:-diwani_db}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
    secrets:
      - django_secret
      - db_password
    depends_on:
      - backend
      - redis
    networks:
      - diwani_internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # =============================
  # Nginx (Reverse Proxy + WAF)
  # =============================
  nginx:
    image: nginx:1.27-alpine
    container_name: diwani_nginx
    restart: unless-stopped
    <<: *security-opts
    user: "101:101"  # nginx user
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=128M
      - /var/run:size=16M
      - /tmp:size=64M
    volumes:
      - ./docker/nginx.secure.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - diwani_internal
      - diwani_public
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # =============================
  # Wazuh Agent (SIEM/IDS)
  # =============================
  wazuh-agent:
    image: wazuh/wazuh-agent:4.8.0
    container_name: diwani_wazuh_agent
    restart: unless-stopped
    hostname: diwani-server
    environment:
      - WAZUH_MANAGER=${WAZUH_MANAGER_IP:-wazuh.diwani.sa}
      - WAZUH_AGENT_GROUP=diwani-servers
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - wazuh_agent_data:/var/ossec/data
      - ./docker/wazuh/ossec.conf:/var/ossec/etc/ossec.conf:ro
    networks:
      - diwani_internal
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

# =============================
# Secrets (Docker Secrets)
# =============================
secrets:
  django_secret:
    file: ./secrets/django_secret.txt
  db_password:
    file: ./secrets/db_password.txt

# =============================
# Volumes
# =============================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  wazuh_agent_data:
    driver: local

# =============================
# Networks
# =============================
networks:
  diwani_internal:
    driver: bridge
    internal: true  # No external access
  diwani_public:
    driver: bridge
