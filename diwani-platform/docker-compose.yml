# ===================================
# منصة ديواني - Docker Compose
# Diwani Platform - Development Environment
# ===================================

services:
  # =============================
  # PostgreSQL Database + PostGIS
  # =============================
  db:
    image: postgis/postgis:16-3.4
    container_name: diwani_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: diwani_db
      POSTGRES_USER: diwani_user
      POSTGRES_PASSWORD: diwani_secure_pass_2025
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diwani_user -d diwani_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - diwani_network

  # =============================
  # Redis (Cache & Celery Broker)
  # =============================
  redis:
    image: redis:7.4-alpine
    container_name: diwani_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - diwani_network

  # =============================
  # Django Backend Application
  # =============================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diwani_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2"
    volumes:
      - ./backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgis://diwani_user:diwani_secure_pass_2025@db:5432/diwani_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - diwani_network

  # =============================
  # Celery Worker (Background Tasks)
  # =============================
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diwani_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l INFO --concurrency=4
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgis://diwani_user:diwani_secure_pass_2025@db:5432/diwani_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - backend
      - redis
    networks:
      - diwani_network

  # =============================
  # Celery Beat (Scheduled Tasks)
  # =============================
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diwani_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgis://diwani_user:diwani_secure_pass_2025@db:5432/diwani_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - backend
      - redis
    networks:
      - diwani_network

  # =============================
  # Flower (Celery Monitoring)
  # =============================
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diwani_flower
    restart: unless-stopped
    command: celery -A config flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - celery_worker
    networks:
      - diwani_network

  # =============================
  # Elasticsearch (Advanced Search)
  # =============================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: diwani_elasticsearch
    restart: unless-stopped
    environment:
      - node.name=diwani-es01
      - cluster.name=diwani-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - diwani_network

  # =============================
  # Kibana (Elasticsearch UI)
  # =============================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: diwani_kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - SERVER_NAME=diwani-kibana
      - I18N_LOCALE=ar
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - diwani_network

  # =============================
  # Nginx (Reverse Proxy)
  # =============================
  nginx:
    image: nginx:1.27-alpine
    container_name: diwani_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - diwani_network

# =============================
# Volumes
# =============================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  elasticsearch_data:
    driver: local

# =============================
# Networks
# =============================
networks:
  diwani_network:
    driver: bridge
