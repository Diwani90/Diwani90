# ===================================
# منصة ديواني - Nginx Security Configuration
# Saudi NCA / OWASP Compliance
# ===================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

# Security: Limit worker connections
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # =============================
    # Basic Settings
    # =============================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with security info
    log_format security '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        '$request_time $upstream_response_time '
                        '$ssl_protocol $ssl_cipher';

    access_log /var/log/nginx/access.log security;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # =============================
    # Security Headers
    # =============================
    # Hide nginx version
    server_tokens off;
    # Note: more_clear_headers requires headers-more module
    # Use proxy_hide_header in location blocks instead

    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;

    # XSS Protection
    add_header X-XSS-Protection "1; mode=block" always;

    # MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' wss: https://api.moyasar.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Permissions Policy
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), payment=(self), usb=()" always;

    # =============================
    # SSL Configuration
    # =============================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # =============================
    # Rate Limiting
    # =============================
    # General requests
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # API endpoints
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Authentication endpoints (strict)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/m;

    # OTP requests (very strict)
    limit_req_zone $binary_remote_addr zone=otp:10m rate=1r/m;

    # Connection limits
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # =============================
    # Request Size Limits
    # =============================
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    # =============================
    # Timeouts
    # =============================
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # =============================
    # Gzip Compression
    # =============================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # =============================
    # Upstream Backend
    # =============================
    upstream django {
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # =============================
    # HTTP -> HTTPS Redirect
    # =============================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Health check endpoint (no redirect)
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =============================
    # Main HTTPS Server
    # =============================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.diwani.sa diwani.sa localhost;

        # SSL Certificates
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Connection limits
        limit_conn conn_limit 20;

        # =============================
        # Security: Block Known Attack Tools
        # =============================
        # Note: Only block known malicious tools, not legitimate clients
        if ($http_user_agent ~* (scanner|nikto|sqlmap|nmap|masscan|havij|acunetix|nessus)) {
            return 403;
        }

        # Block common exploit paths
        location ~* (\.git|\.env|\.htaccess|wp-admin|phpmyadmin|xmlrpc\.php) {
            deny all;
            return 404;
        }

        # =============================
        # Static Files
        # =============================
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;

            # Limit rate for static files
            limit_req zone=general burst=20 nodelay;
        }

        # =============================
        # Media Files
        # =============================
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff" always;

            # Prevent script execution in media
            location ~* \.(php|py|pl|sh|bash)$ {
                deny all;
            }

            limit_req zone=general burst=10 nodelay;
        }

        # =============================
        # API Health Check
        # =============================
        location /api/health/ {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # No rate limiting for health checks
            access_log off;
        }

        # =============================
        # Authentication Endpoints (Strict Rate Limit)
        # =============================
        location /api/v1/accounts/auth/request-otp {
            limit_req zone=otp burst=2 nodelay;
            limit_req_status 429;

            proxy_pass http://django;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/accounts/auth/ {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://django;
            include /etc/nginx/proxy_params;
        }

        # =============================
        # Payment Webhooks (No Rate Limit)
        # =============================
        location /api/v1/payments/webhook/ {
            proxy_pass http://django;
            include /etc/nginx/proxy_params;

            # Allow payment provider IPs only
            # allow 185.70.X.X;  # Moyasar
            # allow 54.X.X.X;    # Tap
            # deny all;
        }

        # =============================
        # API Endpoints
        # =============================
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://django;
            include /etc/nginx/proxy_params;
        }

        # =============================
        # Admin Panel (IP Restricted)
        # =============================
        location /admin/ {
            # Restrict to internal IPs only
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;

            limit_req zone=auth burst=3 nodelay;

            proxy_pass http://django;
            include /etc/nginx/proxy_params;
        }

        # =============================
        # Default: 404
        # =============================
        location / {
            return 404;
        }

        # =============================
        # Error Pages
        # =============================
        error_page 429 /429.json;
        location = /429.json {
            internal;
            default_type application/json;
            return 429 '{"error": "تم تجاوز الحد المسموح من الطلبات", "error_en": "Too many requests", "retry_after": 60}';
        }

        error_page 500 502 503 504 /50x.json;
        location = /50x.json {
            internal;
            default_type application/json;
            return 500 '{"error": "خطأ في الخادم", "error_en": "Server error"}';
        }
    }
}
