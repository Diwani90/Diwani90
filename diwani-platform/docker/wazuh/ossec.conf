<!--
===================================
منصة ديواني - Wazuh Agent Configuration
Security Information and Event Management (SIEM)
===================================
-->
<ossec_config>
  <!-- Global Settings -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
  </global>

  <!-- Wazuh Manager Connection -->
  <client>
    <server>
      <address>WAZUH_MANAGER_IP</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>WAZUH_MANAGER_IP</manager_address>
    </enrollment>
  </client>

  <!-- File Integrity Monitoring (FIM) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- Django Application Files -->
    <directories check_all="yes" realtime="yes">/app/config</directories>
    <directories check_all="yes" realtime="yes">/app/apps</directories>

    <!-- System Configuration -->
    <directories check_all="yes">/etc/nginx</directories>
    <directories check_all="yes">/etc/passwd,/etc/shadow,/etc/group</directories>

    <!-- Ignore patterns -->
    <ignore>/app/.cache</ignore>
    <ignore>/app/__pycache__</ignore>
    <ignore type="sregex">.pyc$</ignore>
    <ignore type="sregex">.log$</ignore>
  </syscheck>

  <!-- Rootkit Detection -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
  </rootcheck>

  <!-- Log Collection -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/error.log</location>
  </localfile>

  <!-- Django Application Logs -->
  <localfile>
    <log_format>json</log_format>
    <location>/app/logs/django.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/app/logs/security.log</location>
  </localfile>

  <!-- Docker Logs -->
  <localfile>
    <log_format>json</log_format>
    <command>docker logs diwani_backend --tail 100 2>&amp;1</command>
    <alias>docker-backend</alias>
    <frequency>60</frequency>
  </localfile>

  <!-- Security Configuration Assessment -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>

    <!-- CIS Benchmarks -->
    <policies>
      <policy>cis_debian_linux.yml</policy>
      <policy>cis_docker.yml</policy>
    </policies>
  </sca>

  <!-- Active Response -->
  <active-response>
    <disabled>no</disabled>
  </active-response>

  <!-- Vulnerability Detection -->
  <vulnerability-detector>
    <enabled>yes</enabled>
    <interval>5m</interval>
    <run_on_start>yes</run_on_start>
  </vulnerability-detector>

  <!-- Labels for Alert Enrichment -->
  <labels>
    <label key="environment">production</label>
    <label key="application">diwani</label>
    <label key="region">sa-riyadh</label>
    <label key="compliance">nca-pdpl</label>
  </labels>
</ossec_config>
